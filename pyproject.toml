[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whatelse"
version = "0.1.0"
description = "A local creative studio where collaborating AI agents generate unconventional ideas for a challenge you describe."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146",
    "uvicorn>=0.54",
    "jinja2>=3.1",
    "sqlmodel>=0.0.48",
    "pydantic>=2.14",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whatelse = [
    "config.toml",
    "techniques/*.md",
    "prompts/*.md",
    "templates/*.html",
    "static/*",
    "demo/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
